name: {{ cookiecutter.project_name }}
runtime:
  name: python
  options:
    toolchain: poetry
    virtualenv: venv
description: |
  {{ cookiecutter.project_short_description }}

main: infra

config:
  pulumi:tags:
    value:
      pulumi:template: {% if cookiecutter.provider == 'aws' %}aws-python{% else %}{{ cookiecutter.provider }}-python{% endif %}

template:
  description: |
    Plantilla de Infraestructura del proyecto