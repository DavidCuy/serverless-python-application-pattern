[spa.project.definition]
name = "{{ cookiecutter.project_name }}"
description = "{{ cookiecutter.project_short_description }}"
author = "{{ cookiecutter.author_name }}"
author_email = "{{ cookiecutter.author_email }}"
base_api = "api.yaml"
api_build_mode = "{% if cookiecutter.provider == 'container-cloud' %}container{% else %}serverless{% endif %}"
provider = "{{ cookiecutter.provider }}"

[spa.template.files]
model = ".spa/templates/models/model.txt"
service = ".spa/templates/models/service.txt"
controller = ".spa/templates/models/controller.txt"
endpoint = ".spa/templates/{{ cookiecutter.provider }}/function_endpoint.txt"
function = ".spa/templates/{{ cookiecutter.provider }}/function.txt"
test_function = ".spa/templates/{{ cookiecutter.provider }}/test_function.txt"
function_conf = ".spa/templates/{{ cookiecutter.provider }}/function_conf.txt"

[spa.project.folders]
root = "src"
models = "src/libs/databases/python/core_db/models"
services = "src/libs/databases/python/core_db/services"
controllers = "src/libs/core/python/core_http/controllers"
jsons = ".spa/templates/json"
functions = "src/functions"
libs = "src/libs"
